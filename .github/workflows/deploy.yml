name: Release

# Every push to main is released automatically: the next patch version
# (v1.0.27 -> v1.0.28) is computed, the image is built and pushed to GHCR,
# and the git tag is created. Kubernetes picks up the new image tag.
#
# Pushing a v* tag by hand still works and builds exactly that version
# (use this for minor/major bumps, e.g. v1.1.0).
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.env.example'
      - 'iterations/**'
      - '.claude/**'

# Releases run one at a time so two merges can never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ekenheim/marketing-agency-website

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          git fetch --tags --force
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Commit was already released (e.g. tagged by hand and pushed with main)
          existing=$(git tag --points-at HEAD --list 'v*' | head -n1)
          if [ -n "$existing" ]; then
            echo "HEAD is already tagged $existing - nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "Latest release is $latest, releasing $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Lint
        if: steps.version.outputs.skip != 'true'
        run: |
          npm ci
          npm run lint

      - name: Log in to GHCR
        if: steps.version.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest

      # Tag only after the image exists, so a failed build never burns a version.
      - name: Create git tag
        if: steps.version.outputs.create_tag == 'true'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Summary
        if: steps.version.outputs.skip != 'true'
        run: echo "Released \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
